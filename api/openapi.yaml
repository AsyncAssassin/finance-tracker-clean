openapi: 3.0.3
info:
  title: Finance Tracker API
  version: 0.6.0
  description: |
    HTTP API системы аналитики личных трат. Все запросы проходят через Gateway,
    который валидирует данные, проверяет токен и вызывает сервисы Ledger и Auth
    по gRPC.

    **Авторизация.** Получите токен через `POST /api/auth/register` (новый
    аккаунт) или `POST /api/auth/login` и передавайте его в заголовке
    `Authorization: Bearer <access_token>`, в Swagger UI для этого есть кнопка
    **Authorize**. Без токена все `/api/*`, кроме `/api/auth/*`, отвечают 401.
    Токен имеет формат JWT и действует 24 часа (настраивается `JWT_TTL`); после истечения войдите заново.
    Данные (транзакции, бюджеты, отчёты) у каждого пользователя свои.

    **JSON** должен содержать ровно один объект без повторных и неизвестных полей.
    Тело ограничено 1 МиБ, включая пробелы; вход и регистрация: 16 КиБ и 5 с. Текст операций, бюджетов и фильтров
    должен быть в UTF-8 без NUL.

    **Деньги** передаются как число с не более чем двумя знаками после запятой
    (`1250.50`) или как строка (`"1250,50"`); внутри хранятся в копейках.
    Экспонента проверяется до расчёта. Переполнение суммы отчёта или накопленных
    расходов даёт 400 `invalid_request`, а не отрицательный результат.
    **Даты** передаются как строки `YYYY-MM-DD` без времени и часового пояса.

    **Квоты пилота:** 10 000 транзакций и 100 различных категорий на аккаунт.
    Считается объединение категорий расходов и бюджетов. Превышение даёт 409
    quota_exceeded; существующие записи можно читать, бюджеты изменять.
    Категории нормализуются в Unicode NFC.

    **Бюджет** задаётся на категорию; его `period` говорит, на какой срок
    действует лимит: `month` (по умолчанию) задаёт лимит на каждый календарный месяц,
    `year` задаёт лимит на каждый год, `none` задаёт один лимит на всё время. Транзакция,
    выводящая траты категории за свой период сверх лимита, отклоняется с кодом 409.

    **Ошибки** всегда имеют одну форму: объект `error` с полями `code`,
    `message` и необязательным `details`. Пути с повторными слешами или отдельными
    сегментами `.` и `..` отклоняются с `400 invalid_request` без перенаправления.
    Любой эндпоинт `/api/*` может
    ответить `502 ledger_unavailable` или `502 auth_unavailable`, если нужный
    сервис недоступен, и `504 timeout`, если он не ответил вовремя
    (`LEDGER_TIMEOUT`, `AUTH_TIMEOUT`).
    При занятых слотах Gateway отвечает `503 server_busy` с `Retry-After: 1`: максимум
    32 активных API-запроса, среди них четыре auth-запроса, один экспорт и два импорта
    на процесс, по одному импорту на пользователя. Перегрузка Auth тоже даёт 503.
    Повторяйте запись с тем же external_id. `/ping` остаётся доступен.
security:
  - bearerAuth: []
servers:
  - url: /
    description: Текущий сервер, локальный запуск или публичный стенд
tags:
  - name: service
    description: Проверка работоспособности и документация
  - name: auth
    description: Регистрация и вход, получение токена
  - name: transactions
    description: Транзакции (траты)
  - name: budgets
    description: Бюджеты по категориям
  - name: reports
    description: Отчёты
paths:
  /ping:
    get:
      tags: [service]
      summary: Проверка, что шлюз жив
      security: []
      responses:
        "200":
          description: pong
          content:
            text/plain:
              schema:
                type: string
                example: pong
  /openapi.yaml:
    get:
      tags: [service]
      summary: Этот документ
      security: []
      responses:
        "200":
          description: OpenAPI в YAML
          content:
            application/yaml:
              schema:
                type: string
  /api/auth/register:
    post:
      tags: [auth]
      summary: Зарегистрироваться и сразу получить токен
      description: |
        Email приводится к нижнему регистру и должен быть уникальным.
        Регистрация разрешена только адресам из AUTH_REGISTRATION_EMAILS; пустой
        список закрывает её. Список не подтверждает владельца почты. До 100 аккаунтов. Пароль содержит
        от 15 до 128 символов, без требований к составу (фраза из нескольких слов
        подходит лучше всего), не из списка распространённых и не совпадает с email.
        Auth допускает 10 валидных попыток регистрации за фиксированное минутное окно
        на один процесс. Превышение возвращает 429 с Retry-After.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
            examples:
              new_user:
                value: {email: "anna@example.com", password: "зелёный трамвай едет"}
      responses:
        "503":
          $ref: "#/components/responses/ServerBusy"
        "201":
          description: Аккаунт создан
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "408":
          description: Тело auth-запроса не получено за 5 секунд
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "403":
          description: Регистрация не разрешена для адреса (registration_closed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email занят (`email_taken`) или достигнута квота аккаунтов (`quota_exceeded`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: {code: email_taken, message: "an account with this email already exists, log in instead"}
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/auth/login:
    post:
      tags: [auth]
      summary: Войти и получить новый токен
      description: |
        За фиксированное минутное окно допускается 5 неверных паролей на email.
        Успешный вход сбрасывает ошибки, отмена и перегрузка их не расходуют.
        После пятой ошибки вход блокируется до конца окна. Параллельная попытка
        для одного email получает 429 с Retry-After: 1. Общего минутного лимита нет.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
            examples:
              existing_user:
                value: {email: "anna@example.com", password: "зелёный трамвай едет"}
      responses:
        "503":
          $ref: "#/components/responses/ServerBusy"
        "200":
          description: Вход выполнен
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "408":
          description: Тело auth-запроса не получено за 5 секунд
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "401":
          description: |
            Неверный email или пароль (`invalid_credentials`). Ответ одинаков для
            несуществующего email и неверного пароля.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: {code: invalid_credentials, message: "invalid email or password"}
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /api/transactions:
    post:
      tags: [transactions]
      summary: Добавить транзакцию
      description: |
        Проверяет бюджет категории за период даты транзакции. Если траты вместе
        с новой суммой превысят лимит, транзакция не сохраняется и возвращается 409.
        До 10 000 транзакций и 100 категорий на аккаунт; превышение даёт 409 quota_exceeded.
        Повторная отправка с тем же `external_id` возвращает 409 `already_exists`
        с `id` уже сохранённой транзакции.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
            examples:
              groceries:
                value: {amount: 1250.50, category: "еда", description: "продукты на неделю", date: "2026-10-03"}
      responses:
        "503":
          $ref: "#/components/responses/ServerBusy"
        "201":
          description: Транзакция сохранена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "409":
          description: Лимит бюджета превышен (`budget_exceeded`) или `external_id` уже использован (`already_exists`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                budget_exceeded:
                  value:
                    error:
                      code: budget_exceeded
                      message: 'budget exceeded for "еда" (2026-10): spent 4750.50 + new 500.00 > limit 5000.00'
                      details: {category: "еда", period: month, period_label: "2026-10", limit: 5000.00, spent: 4750.50, amount: 500.00, remaining: 249.50}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [transactions]
      summary: Список транзакций
      description: Новые сначала (по дате, затем по id).
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: category
          in: query
          schema: {type: string}
          description: |
            Только эта категория: пробелы нормализуются, применяется Unicode NFC и простое
            преобразование в нижний регистр, без языковых правил case folding. Текст должен быть
            корректным UTF-8 без NUL, иначе `400 validation_error` с полем `category`,
            как у остальных текстовых полей; проверка выполняется до обращения к Ledger.
        - name: limit
          in: query
          schema: {type: integer, minimum: 0, default: 100, maximum: 1000}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "503":
          $ref: "#/components/responses/ServerBusy"
        "200":
          description: Транзакции
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/transactions/import:
    post:
      tags: [transactions]
      summary: Импортировать транзакции из CSV
      description: |
        Тело запроса содержит CSV-файл (до 5 МБ и 10 000 строк). Первая строка содержит названия
        колонок в любом порядке и регистре: `id`, `date`, `category`, `amount`,
        `description`, `external_id`, как у экспорта, так что его файл
        импортируется обратно без задвоения (по `id`); `category` и `amount`
        обязательны. В качестве разделителя используется `,` или `;`, BOM из Excel пропускается, сумма
        может быть с запятой.

        Ошибки файла целиком (битый CSV, неизвестная или отсутствующая колонка,
        слишком много строк) дают 400 `invalid_csv`, ничего не импортируется. Строки с
        неверными значениями не сохраняются, остальные сохраняются; ответ содержит счётчики
        и итог по каждой строке. Каждая строка проходит те же проверки, что
        `POST /api/transactions`, включая бюджет; строки одной категории и одного
        `external_id` идут в порядке файла. Повтор сохранённого `external_id`
        отклоняется (`already_exists`), поэтому повторный импорт ничего не
        задваивает. `IMPORT_TIMEOUT` ограничивает отдельно чтение тела запроса и вызов
        Ledger, который начинается после разбора файла; перед истечением срока вызова
        Ledger или при сбое хранилища импорт останавливается и возвращает итог:
        недошедшие строки получают статус `canceled`. Файл, не загруженный за срок чтения, получает
        `408 timeout`.
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string}
            example: |
              date,category,amount,description,external_id
              2026-10-01,еда,1250.50,продукты,bank-001
              2026-10-02,кафе,1800,обед,bank-002
      responses:
        "503":
          $ref: "#/components/responses/ServerBusy"
        "200":
          description: Файл обработан; итог по каждой строке
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Файл не читается целиком (`invalid_csv`, номер строки в `details.line`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: {code: invalid_csv, message: 'unknown column "ammount"; the columns are: id, date, category, amount, description, external_id', details: {line: 1}}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          description: Тело CSV не получено за IMPORT_TIMEOUT (`timeout`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Файл больше 5 МБ (`payload_too_large`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Тело отправлено не как `text/csv` (`unsupported_media_type`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/transactions/export.csv:
    get:
      tags: [transactions]
      summary: Экспорт транзакций в CSV
      description: |
        Колонки `id,date,category,amount,description,external_id`, разделитель запятая,
        кодировка UTF-8, сумма с точкой и двумя знаками. До 100 000 строк.
        Текстовые ячейки, начинающиеся с `=`, `+`, `-`, `@`, получают ведущий
        апостроф, чтобы таблицы не исполняли их как формулы.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: category
          in: query
          schema: {type: string}
          description: |
            Только эта категория: пробелы нормализуются, применяется Unicode NFC и простое
            преобразование в нижний регистр, без языковых правил case folding. Текст должен быть
            корректным UTF-8 без NUL, иначе `400 validation_error` с полем `category`;
            проверка выполняется до обращения к Ledger.
      responses:
        "503":
          $ref: "#/components/responses/ServerBusy"
        "200":
          description: CSV-файл
          content:
            text/csv:
              schema:
                type: string
                example: |
                  id,date,category,amount,description,external_id
                  2,2026-10-03,транспорт,2000.00,проездной,example-transport
                  1,2026-10-03,еда,1250.50,продукты на неделю,example-food
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/budgets:
    $ref: "#/paths/~1api~1budget"
  /api/budget:
    post:
      tags: [budgets]
      summary: Создать или заменить бюджет категории (upsert)
      description: У пользователя один бюджет на категорию. Повторный запрос заменяет лимит и период.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetInput"
            examples:
              monthly:
                value: {category: "еда", limit: 5000, period: month}
      responses:
        "503":
          $ref: "#/components/responses/ServerBusy"
        "201":
          description: Бюджет создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "200":
          description: Бюджет обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "409":
          description: Достигнута квота категорий (quota_exceeded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [budgets]
      summary: Список бюджетов
      responses:
        "503":
          $ref: "#/components/responses/ServerBusy"
        "200":
          description: Бюджеты, отсортированные по категории
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Budget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/reports/summary:
    get:
      tags: [reports]
      summary: Сводный отчёт за период
      description: |
        Траты по категориям за `[from, to]`, общий итог и использование бюджета.
        Для бюджета с периодом `month` лимит в отчёте равен месячному лимиту,
        умноженному на число календарных месяцев, которые затрагивает период
        (аналогично для `year`). Категории с бюджетом попадают в отчёт, даже если
        трат не было. `remaining` относится к диапазону отчёта и не определяет
        допустимую сумму следующего расхода: её проверяют за период бюджета,
        содержащий дату расхода. Диапазон не длиннее 10 лет.
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date}
          example: "2026-10-01"
        - name: to
          in: query
          required: true
          schema: {type: string, format: date}
          example: "2026-10-31"
      responses:
        "503":
          $ref: "#/components/responses/ServerBusy"
        "200":
          description: Отчёт
          headers:
            X-Cache:
              description: |
                Как отчёт получен: `MISS`, построен по базе и положен в кеш Redis,
                `HIT`, взят из кеша. Нет заголовка, кеш выключен или недоступен.
                Добавление транзакции или изменение бюджета сбрасывает кеш пользователя.
              schema: {type: string, enum: [HIT, MISS]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен из `access_token` ответа `/api/auth/register` или `/api/auth/login`
  parameters:
    From:
      name: from
      in: query
      schema: {type: string, format: date}
      description: Начало периода включительно
    To:
      name: to
      in: query
      schema: {type: string, format: date}
      description: Конец периода включительно
  responses:
    ServerBusy:
      description: Все слоты обработки заняты; повторите запрос позже (`server_busy`)
      headers:
        Retry-After:
          schema: {type: integer, example: 1}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Лимит попыток входа или регистрации исчерпан (`rate_limited`); повторите после Retry-After
      headers:
        Retry-After:
          description: Число секунд до окончания текущего окна ограничения
          schema: {type: integer, minimum: 1, maximum: 60, example: 30}
        Cache-Control:
          schema: {type: string, example: no-store}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: rate_limited, message: "too many authentication attempts, try again later"}
    BadRequest:
      description: Некорректный запрос, битый JSON (`invalid_json`) или ошибки валидации (`validation_error`, поля в `details`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_error
              message: request validation failed
              details: {amount: "must be greater than 0", category: "must not be empty"}
    PayloadTooLarge:
      description: Тело запроса больше допустимого размера (`payload_too_large`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: payload_too_large, message: "request body must be at most 1048576 bytes"}
    Unauthorized:
      description: |
        Нет токена, токен подделан или истёк (`unauthorized`). Заголовок
        `WWW-Authenticate: Bearer` подсказывает схему; получите новый токен через
        `/api/auth/login`.
      headers:
        WWW-Authenticate:
          schema: {type: string, example: 'Bearer realm="finance-tracker", error="invalid_token"'}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: {code: unauthorized, message: "the access token is invalid or expired, log in again"}
    Internal:
      description: Внутренняя ошибка; `details.request_id` помогает найти запрос в логах
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: internal error
              details: {request_id: "9f3c2a1b7d4e5f60"}
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254, example: anna@example.com}
        password: {type: string, format: password, minLength: 15, maxLength: 128, example: "зелёный трамвай едет"}
    User:
      type: object
      required: [id, email, created_at]
      properties:
        id: {type: integer, format: int64, example: 1}
        email: {type: string, example: anna@example.com}
        created_at: {type: string, format: date-time}
    Session:
      type: object
      required: [user, access_token, token_type, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_token:
          type: string
          description: "JWT (HS256); передавайте в `Authorization: Bearer ...`"
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.signature
        token_type: {type: string, enum: [Bearer]}
        expires_at: {type: string, format: date-time, description: Когда токен перестанет действовать}
    ImportResult:
      type: object
      required: [total, created, failed, rows]
      properties:
        total: {type: integer, description: Строк с данными в файле}
        created: {type: integer}
        failed: {type: integer}
        rows:
          type: array
          description: По одной записи на строку файла, в порядке строк
          items:
            type: object
            required: [line, status]
            properties:
              line: {type: integer, description: Номер строки в файле (заголовок имеет номер 1)}
              status: {type: string, enum: [created, failed]}
              id: {type: integer, format: int64, description: ID сохранённой транзакции}
              error:
                type: object
                description: |
                  Почему строка не сохранена: `validation_error` (поля в `details`),
                  `budget_exceeded`, `already_exists` (`details.id`, сохранённая
                  транзакция), `canceled` (импорт прерван до этой строки), `internal_error`.
                properties:
                  code: {type: string}
                  message: {type: string}
                  details: {}
    Money:
      type: number
      format: double
      multipleOf: 0.01
      description: Сумма в рублях с двумя знаками; в запросе допускается и строка "1250,50"
      example: 1250.50
    Date:
      type: string
      format: date
      example: "2026-10-03"
    Period:
      type: string
      enum: [month, year, none]
      default: month
      description: На какой срок действует лимит бюджета
    TransactionInput:
      type: object
      required: [amount, category]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        category:
          type: string
          maxLength: 64
          description: Приводится к нижнему регистру, пробелы по краям убираются
          example: еда
        description:
          type: string
          maxLength: 255
          example: продукты на неделю
        date:
          allOf:
            - $ref: "#/components/schemas/Date"
          description: День траты; по умолчанию, сегодня
        external_id:
          type: string
          maxLength: 64
          description: Необязательный идентификатор на стороне клиента (например, строки таблицы) для защиты от повторной отправки
    Transaction:
      type: object
      required: [id, amount, category, description, date, created_at]
      properties:
        id: {type: integer, format: int64, example: 1}
        amount:
          $ref: "#/components/schemas/Money"
        category: {type: string, example: еда}
        description: {type: string, example: продукты на неделю}
        date:
          $ref: "#/components/schemas/Date"
        external_id: {type: string}
        created_at: {type: string, format: date-time}
    BudgetInput:
      type: object
      required: [category, limit]
      properties:
        category: {type: string, maxLength: 64, example: еда}
        limit:
          $ref: "#/components/schemas/Money"
        period:
          $ref: "#/components/schemas/Period"
    Budget:
      type: object
      required: [category, limit, period]
      properties:
        category: {type: string, example: еда}
        limit:
          $ref: "#/components/schemas/Money"
        period:
          $ref: "#/components/schemas/Period"
    Summary:
      type: object
      required: [from, to, total, categories]
      properties:
        from:
          $ref: "#/components/schemas/Date"
        to:
          $ref: "#/components/schemas/Date"
        total:
          $ref: "#/components/schemas/Money"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategorySummary"
      example:
        from: "2026-10-01"
        to: "2026-10-31"
        total: 6750.50
        categories:
          - {category: "еда", spent: 4750.50, budget: {period: month, limit: 5000.00, remaining: 249.50, percent: 95.01}}
          - {category: "здоровье", spent: 700.00, budget: null}
          - {category: "транспорт", spent: 1300.00, budget: {period: month, limit: 2500.00, remaining: 1200.00, percent: 52}}
    CategorySummary:
      type: object
      required: [category, spent, budget]
      properties:
        category: {type: string}
        spent:
          $ref: "#/components/schemas/Money"
        budget:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BudgetUsage"
    BudgetUsage:
      type: object
      required: [period, limit, remaining, percent]
      properties:
        period:
          $ref: "#/components/schemas/Period"
        limit:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Лимит за весь период отчёта
        remaining:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: |
            Неотрицательная разница между лимитом отчёта и тратами за `[from, to]`.
            Это не допустимая сумма следующего расхода: её проверяют за период
            бюджета, содержащий дату расхода, с учётом трат вне диапазона отчёта.
        percent:
          type: number
          description: Потрачено в процентах от лимита, округлено до сотых
          example: 95.01
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_json, invalid_csv, unsupported_media_type, validation_error, invalid_request, unauthorized, invalid_credentials, rate_limited, server_busy, email_taken, budget_exceeded, already_exists, conflict, not_found, method_not_allowed, payload_too_large, ledger_unavailable, auth_unavailable, service_unavailable, timeout, client_closed_request, internal_error]
            message: {type: string}
            details:
              description: Зависит от кода, поля с ошибками, подробности бюджета, request_id
