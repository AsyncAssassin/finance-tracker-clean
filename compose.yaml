name: finance-tracker-clean

# Common logging and process limits for all services.
x-runtime: &runtime
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  cpus: 1.0
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app: &app
  <<: *runtime
  read_only: true
  cap_drop: [ALL]
  tmpfs: ["/tmp:size=16m,mode=1777"]
  mem_limit: 512m

services:
  db:
    networks: [core]
    <<: *runtime
    mem_limit: 384m
    build:
      context: .
      dockerfile: deploy/postgres.Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-}
      AUTH_MIGRATION_PASSWORD: ${AUTH_MIGRATION_PASSWORD:-}
      LEDGER_MIGRATION_PASSWORD: ${LEDGER_MIGRATION_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    # Host access for local tools is opt-in through compose.dev.yaml.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    networks: [cache]
    <<: *runtime
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=1m,mode=1777"]
    build:
      context: .
      dockerfile: deploy/redis.Dockerfile
    # A pure cache: no persistence, bounded memory. volatile-lru evicts only
    # keys with a TTL (cached reports) and never the per-user version keys.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --user ledger ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ledger:
    networks: [core, cache]
    <<: *app
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: ledger
    environment:
      GOMEMLIMIT: 384MiB
      GRPC_ADDR: ":9090"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # The ledger decides the date of a transaction sent without one.
      TZ: ${TZ:-Europe/Moscow}
      # Credentials travel in the libpq variables, not in the URL, so a
      # password with URL metacharacters needs no encoding.
      DATABASE_URL: postgres://db:5432/${POSTGRES_DB:-finance}?sslmode=disable
      PGUSER: ledger_app
      PGPASSWORD: ${LEDGER_DB_PASSWORD:-}
      DB_CONNECT_WAIT: ${DB_CONNECT_WAIT:-30s}
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REPORT_CACHE_TTL: ${REPORT_CACHE_TTL:-5m}
      IMPORT_WORKERS: ${IMPORT_WORKERS:-4}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-16}
    # The ledger trusts the user ID. Only the core network can reach it.
    healthcheck:
      # The image has no shell; the binary checks the gRPC health service.
      test: ["CMD", "/service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      ledger-migrate:
        condition: service_completed_successfully
      # The cache is optional: the ledger starts and serves reports from
      # the database even if Redis does not come up.
      redis:
        condition: service_started
        required: false
    restart: unless-stopped

  auth:
    networks: [core]
    <<: *app
    mem_limit: 192m
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: auth
    environment:
      GOMEMLIMIT: 144MiB
      GRPC_ADDR: ":9091"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      TZ: ${TZ:-Europe/Moscow}
      DATABASE_URL: postgres://db:5432/${POSTGRES_DB:-finance}?sslmode=disable
      PGUSER: auth_app
      PGPASSWORD: ${AUTH_DB_PASSWORD:-}
      DB_CONNECT_WAIT: ${DB_CONNECT_WAIT:-30s}
      # No default: without a secret in .env the service exits at startup
      # with a hint how to make one. It is not a compose-level requirement,
      # so commands like make db, logs and down work without it.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL: ${JWT_TTL:-24h}
      AUTH_REGISTRATION_EMAILS: ${AUTH_REGISTRATION_EMAILS:-}
    healthcheck:
      test: ["CMD", "/service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  auth-migrate:
    networks: [core]
    <<: *app
    mem_limit: 128m
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: migrate
    command: ["-service", "auth"]
    environment:
      DATABASE_URL: postgres://db:5432/${POSTGRES_DB:-finance}?sslmode=disable
      PGUSER: auth_migrator
      PGPASSWORD: ${AUTH_MIGRATION_PASSWORD:-}
      DB_CONNECT_WAIT: ${DB_CONNECT_WAIT:-30s}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  ledger-migrate:
    networks: [core]
    <<: *app
    mem_limit: 128m
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: migrate
    command: ["-service", "ledger"]
    environment:
      DATABASE_URL: postgres://db:5432/${POSTGRES_DB:-finance}?sslmode=disable
      PGUSER: ledger_migrator
      PGPASSWORD: ${LEDGER_MIGRATION_PASSWORD:-}
      DB_CONNECT_WAIT: ${DB_CONNECT_WAIT:-30s}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  gateway:
    networks: [edge, core]
    <<: *app
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: gateway
    environment:
      GOMEMLIMIT: 384MiB
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      TZ: ${TZ:-Europe/Moscow}
      LEDGER_GRPC_ADDR: ledger:9090
      LEDGER_TIMEOUT: ${LEDGER_TIMEOUT:-10s}
      AUTH_GRPC_ADDR: auth:9091
      AUTH_TIMEOUT: ${AUTH_TIMEOUT:-10s}
      IMPORT_TIMEOUT: ${IMPORT_TIMEOUT:-1m}
      # The gateway verifies the tokens auth signs, so both need the secret.
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "${HTTP_PORT:-127.0.0.1:8080}:8080"
    healthcheck:
      test: ["CMD", "/service", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      ledger:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped


networks:
  edge:
  core:
    internal: true
  cache:
    internal: true

volumes:
  pgdata:
